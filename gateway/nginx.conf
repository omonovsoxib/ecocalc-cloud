# Lokal sinov uchun: Kubernetes Ingress vazifasini bajaradi
server {
  listen 80;
  location /api/auth/     { proxy_pass http://auth-service:8000; }
  location /api/projects  { proxy_pass http://project-service:8000; proxy_read_timeout 30s; }
  location /api/calc      { proxy_pass http://calc-service:8000; }
  location /api/reports/  { proxy_pass http://report-service:8000; }
  location /              { proxy_pass http://frontend:80; }
}
