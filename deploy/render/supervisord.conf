[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:calc]
directory=/app/calc
command=uvicorn main:app --host 127.0.0.1 --port 8001
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth]
directory=/app/auth
command=uvicorn main:app --host 127.0.0.1 --port 8002
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:project]
directory=/app/project
command=uvicorn main:app --host 127.0.0.1 --port 8003
environment=CALC_URL="http://127.0.0.1:8001"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:report]
directory=/app/report
command=uvicorn main:app --host 127.0.0.1 --port 8004
environment=PROJECT_URL="http://127.0.0.1:8003"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
