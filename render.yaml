# Render Blueprint: bitta web xizmat (Docker) + bepul PostgreSQL bazasi
services:
  - type: web
    name: ecocalc-cloud
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecocalc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ecocalc-db
    plan: free
    region: frankfurt
    databaseName: ecocalc
    user: ecocalc
